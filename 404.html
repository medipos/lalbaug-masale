<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <title>Lalbaug Masale - Redirecting</title>
  <script>
    // GitHub Pages 404 redirect to index.html
    const segment = window.location.pathname.split('/').pop();
    if (segment === 'admin' || segment === 'admin.html') {
      window.location.replace('admin.html');
    } else {
      window.location.replace('index.html');
    }
  </script>
</head>
<body style="font-family:sans-serif; text-align:center; padding:50px; background:#FAF5ED; color:#5A0B10;">
  <h2>लालबाग मसाले (Lalbaug Masale)</h2>
  <p>पुढील पानावर जात आहे... <a href="index.html">येथे क्लिक करा</a></p>
</body>
</html>
